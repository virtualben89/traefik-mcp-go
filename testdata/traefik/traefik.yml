# Static configuration for integration tests (CI and local).
# API on :8080 (insecure, test only), file provider with fixtures in dynamic.yml.
entryPoints:
  traefik:
    address: ":8080"
  web:
    address: ":8000"
  websecure:
    address: ":8443"
  redir:
    address: ":8001"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  tcp:
    address: ":9000"
  udp:
    address: ":9001/udp"
api:
  insecure: true
  dashboard: false
providers:
  file:
    filename: /etc/traefik/dynamic.yml
log:
  level: WARN
